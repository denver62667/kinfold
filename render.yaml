# Render Blueprint (infrastructure-as-code).
# Push this repo to GitHub, then in Render: New > Blueprint, point at the repo.
services:
  - type: web
    name: kinfold
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
